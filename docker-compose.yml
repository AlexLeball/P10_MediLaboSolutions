services:

  sqlserver:
    image: mcr.microsoft.com/mssql/server:2022-latest
    container_name: sqlserver
    environment:
      ACCEPT_EULA: "Y"
      SA_PASSWORD: "MySuperStrong!Passw0rd"
    ports:
      - "1433:1433"
    healthcheck:
      test: ["CMD-SHELL", "/opt/mssql-tools18/bin/sqlcmd -S localhost -U sa -P MySuperStrong!Passw0rd -Q \"SELECT 1\" -C"]
      interval: 10s
      timeout: 5s
      retries: 15
      start_period: 30s

  patient.api:
    image: patientapi
    build:
      context: .
      dockerfile: Patient.API/Dockerfile
    depends_on:
      sqlserver:
        condition: service_healthy
    ports:
      - "5001:8080"
    environment:
      ASPNETCORE_URLS: http://+:8080
      ASPNETCORE_ENVIRONMENT: Development
      ConnectionStrings__DefaultConnection: "Server=sqlserver,1433;Database=master;User Id=sa;Password=MySuperStrong!Passw0rd;TrustServerCertificate=True;"
    command: ["dotnet", "Patient.API.dll"]

  gateway.api:
    build:
      context: .
      dockerfile: Gateway.API/Dockerfile
    ports:
      - "5000:8080"
    environment:
      ASPNETCORE_URLS: http://+:8080

  frontend.web:
    build:
      context: .
      dockerfile: Frontend.Web/Dockerfile
    ports:
      - "5002:8080"
    environment:
      ASPNETCORE_URLS: http://+:8080